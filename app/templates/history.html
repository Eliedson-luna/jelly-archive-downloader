{% extends "base.html" %}

{% block title %}Histórico · {{ app_name }}{% endblock %}

{% block content %}
<div class="results-header">
  <h1>Histórico de downloads</h1>
  <span class="muted small">atualiza a cada 5 s</span>
</div>

<div class="table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th>Título</th>
        <th>Status</th>
        <th class="progress-col">Progresso</th>
        <th class="num">Tamanho</th>
        <th>Adicionado</th>
        <th class="actions-col">Ações</th>
      </tr>
    </thead>
    <tbody id="history-body">
      {% include "partials/history_rows.html" %}
    </tbody>
  </table>
</div>
{% endblock %}
